name: Cinematic audit fix
on:
  push:
    paths:
      - '.github/workflows/cinematic-audit-fix.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply audited layout corrections
        run: |
          cat > site/assets/styles-cinematic.css <<'CSS'
          /* Sunset cinematic layer — solid colors, isolated products, no overlays */
          :root{--beam:#fa8105!important}
          body::before{display:none!important}
          .gradient-text{background:none!important;-webkit-background-clip:initial!important;background-clip:initial!important;color:var(--orange)!important}
          .halo,.hero-photo:after,.media-feature:after,.device-photo:after{display:none!important}

          /* Product images are objects, never photographic portraits/cards. */
          .hero-art.hero-photo{
            border:0!important;background:transparent!important;border-radius:0!important;
            overflow:visible!important;min-height:580px!important;
          }
          .hero-photo>img{
            position:relative!important;inset:auto!important;width:min(92%,680px)!important;height:560px!important;
            object-fit:contain!important;object-position:center!important;margin:auto!important;
            filter:drop-shadow(0 34px 48px rgba(0,0,0,.72))!important;
            transform:translateZ(0);
          }

          /* Copy never sits on top of a product render. */
          .media-feature-grid{align-items:stretch!important}
          .media-feature{
            min-height:0!important;background:transparent!important;border:0!important;border-radius:0!important;
            overflow:visible!important;display:flex!important;flex-direction:column!important;justify-content:flex-start!important;
            padding:26px 20px 24px!important;
          }
          .media-feature>img{
            position:relative!important;inset:auto!important;width:100%!important;height:340px!important;
            object-fit:contain!important;object-position:center!important;display:block!important;
            filter:drop-shadow(0 28px 38px rgba(0,0,0,.62))!important;transform:none!important;
          }
          .media-feature-copy{
            position:relative!important;left:auto!important;right:auto!important;bottom:auto!important;
            width:100%!important;max-width:520px!important;margin:18px auto 0!important;text-align:center!important;
          }
          .media-feature-copy p{margin-left:auto!important;margin-right:auto!important}
          .media-feature-copy .btn{margin-left:auto!important;margin-right:auto!important}

          .page-product-visual{
            border:0!important;background:transparent!important;border-radius:0!important;overflow:visible!important;
            height:520px!important;display:grid!important;place-items:center!important;
          }
          .page-product-visual img{
            width:100%!important;height:100%!important;object-fit:contain!important;object-position:center!important;
            filter:drop-shadow(0 34px 48px rgba(0,0,0,.68))!important;
          }

          .editorial-media figure:has(img[src*="-transparent-"]),
          .expanded-media figure:has(img[src*="-transparent-"]){
            background:transparent!important;border:0!important;border-radius:0!important;
          }
          .editorial-media img[src*="-transparent-"],.expanded-media img[src*="-transparent-"]{
            object-fit:contain!important;padding:18px!important;filter:drop-shadow(0 22px 34px rgba(0,0,0,.58))!important;
          }

          /* Cinematic rhythm: black stage, negative space, restrained solid orange. */
          .hero,.section,.page-hero{background:#050505!important}
          .hero-copy,.section-head,.section>.container,.page-hero>.container{text-align:center!important}
          .hero-sub,.lede{margin-left:auto!important;margin-right:auto!important}
          .btns{justify-content:center!important}
          .section{border-top:1px solid rgba(255,255,255,.055)}
          .section:first-of-type{border-top:0}
          .eyebrow{color:#c9c4bc!important}
          .nav-link:after{background:#fa8105!important}

          @media (prefers-reduced-motion:no-preference){
            .hero-photo>img{animation:sunsetFloat 7s ease-in-out infinite}
            @keyframes sunsetFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
          }

          @media(max-width:767px){
            .hero{padding-bottom:16px!important}
            .hero-art.hero-photo{width:100%!important;max-width:100%!important;height:228px!important;min-height:228px!important;margin:8px auto 0!important;overflow:visible!important}
            .hero-photo>img{width:100%!important;max-width:310px!important;height:228px!important;object-fit:contain!important;padding:4px 12px!important}
            .media-feature-grid{display:flex!important;gap:12px!important}
            .media-feature{flex:0 0 86%!important;max-width:86%!important;padding:16px 12px 18px!important;background:#090909!important;border:1px solid #222!important}
            .media-feature>img{height:205px!important;padding:8px!important}
            .media-feature-copy{margin-top:10px!important;padding:0 4px!important}
            .media-feature h3{font-size:1.8rem!important;line-height:.95!important}
            .media-feature-copy p{font-size:.8rem!important;line-height:1.4!important;margin:8px auto 12px!important}
            .page-product-visual{height:240px!important;max-width:100%!important;margin-top:12px!important}
            .page-product-visual img{max-width:310px!important;margin:auto!important;padding:6px 12px!important}
            .editorial-media img[src*="-transparent-"],.expanded-media img[src*="-transparent-"]{padding:12px!important}
          }
          CSS

          python - <<'PY'
          from pathlib import Path
          import re
          for p in Path('site').rglob('*.html'):
              s=p.read_text()
              s=s.replace('<div class="halo"></div>','')
              if '/assets/styles-cinematic.css' not in s:
                  s=s.replace('</head>','<link rel="stylesheet" href="/assets/styles-cinematic.css?v=20260817-1"></head>')
              p.write_text(s)

          # Physically remove the duplicated Home section, not only hide it.
          p=Path('site/index.html')
          s=p.read_text()
          marker='<section class="section compact"><div class="container reveal"><div class="eyebrow">COMECE PELO QUE VOCÊ JÁ TEM</div>'
          start=s.find(marker)
          if start!=-1:
              end=s.find('</section>',start)
              if end!=-1:
                  s=s[:start]+s[end+len('</section>'):]
          p.write_text(s)
          PY
      - name: Commit audited cinematic revision
        run: |
          git config user.name 'Sunset Audit Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site
          git diff --cached --quiet && exit 0
          git commit -m 'Remove product overlays and duplicate section for cinematic layout'
          git push
