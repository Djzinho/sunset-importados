name: Apply Sunset PWA and Mockups
on:
  push:
    paths:
      - '.github/workflows/apply-pwa-mockups.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y imagemagick >/dev/null
      - name: Add licensed 3D mockups and PWA icons
        run: |
          mkdir -p site/assets/media
          curl -L --fail --retry 3 'https://ls-graphics-directus-direct.b-cdn.net/assets/dbcab71b-7725-4d89-8994-a695af02f81a?format=webp&quality=90&width=1700' -o /tmp/iphone-mockup.webp
          curl -L --fail --retry 3 'https://ls-graphics-directus-direct.b-cdn.net/assets/9da90f14-4ff7-467f-9cfb-9958ae94b916?format=webp&quality=90&width=1700' -o /tmp/macbook-mockup.webp
          convert /tmp/iphone-mockup.webp -resize '1500x1500>' -quality 91 site/assets/media/iphone-mockup-ls-v1.jpg
          convert /tmp/macbook-mockup.webp -resize '1500x1500>' -quality 91 site/assets/media/macbook-mockup-ls-v1.jpg
          test $(stat -c%s site/assets/media/iphone-mockup-ls-v1.jpg) -gt 50000
          test $(stat -c%s site/assets/media/macbook-mockup-ls-v1.jpg) -gt 50000
          convert site/assets/sunset-logo.webp -resize 148x148 /tmp/logo192.png
          convert -size 192x192 xc:'#050505' /tmp/logo192.png -gravity center -composite site/assets/pwa-icon-192.png
          convert site/assets/sunset-logo.webp -resize 392x392 /tmp/logo512.png
          convert -size 512x512 xc:'#050505' /tmp/logo512.png -gravity center -composite site/assets/pwa-icon-512.png
          convert site/assets/sunset-logo.webp -resize 136x136 /tmp/logo180.png
          convert -size 180x180 xc:'#050505' /tmp/logo180.png -gravity center -composite site/assets/apple-touch-icon.png
          identify site/assets/pwa-icon-192.png site/assets/pwa-icon-512.png site/assets/apple-touch-icon.png site/assets/media/iphone-mockup-ls-v1.jpg site/assets/media/macbook-mockup-ls-v1.jpg
      - name: Wire PWA and mockups into pages
        run: |
          python - <<'PY'
          from pathlib import Path
          manifest='<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/assets/apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Sunset"><link rel="stylesheet" href="/assets/styles-mobile-pwa.css?v=20260817-1">'
          pwa='<script src="/assets/pwa.js?v=20260817-1" defer></script>'
          for p in Path('site').rglob('*.html'):
              if p.name == 'offline.html':
                  continue
              s=p.read_text()
              s=s.replace('content="width=device-width,initial-scale=1"','content="width=device-width,initial-scale=1,viewport-fit=cover"')
              if '/manifest.webmanifest' not in s:
                  s=s.replace('</head>',manifest+'</head>')
              if '/assets/pwa.js' not in s:
                  s=s.replace('</body>',pwa+'</body>')
              s=s.replace('/assets/media/iphone-dark-v3.jpg','/assets/media/iphone-mockup-ls-v1.jpg')
              s=s.replace('/assets/media/iphone-16-pro-v3.jpg','/assets/media/iphone-mockup-ls-v1.jpg')
              s=s.replace('/assets/media/macbook-airpods-v1.jpg','/assets/media/macbook-mockup-ls-v1.jpg')
              p.write_text(s)
          media=Path('MEDIA_SOURCES.md')
          text=media.read_text() if media.exists() else '# Media sources\n'
          block='''\n\n## Licensed 3D product mockups\n- `site/assets/media/iphone-mockup-ls-v1.jpg` — LS Graphics, Free iPhone 15 Pro Mockup. Source: https://www.ls.graphics/assets/free-iphone-15-pro-mockup — listed by the publisher as free for personal and commercial projects.\n- `site/assets/media/macbook-mockup-ls-v1.jpg` — LS Graphics, MacBook Air 2022 Mockup. Source: https://www.ls.graphics/assets/macbook-air-2022-mockup — listed by the publisher as free for personal and commercial projects.\n- These mockups are third-party design assets and are not presented as official Apple marketing artwork or as proof of Sunset inventory.\n'''
          if 'Licensed 3D product mockups' not in text:
              media.write_text(text+block)
          PY
      - name: Commit PWA and product media
        run: |
          git config user.name 'Sunset PWA Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site MEDIA_SOURCES.md
          git diff --cached --quiet && exit 0
          git commit -m 'Turn Sunset into PWA and add licensed 3D product mockups'
          git push
