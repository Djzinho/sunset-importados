name: Prepare licensed site images

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/prepare-site-images.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch licensed images
        run: |
          mkdir -p prepared-images
          curl -L --fail 'https://images.unsplash.com/photo-1727013884184-b313982327f3?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=60&w=3000' -o prepared-images/iphone-16-pro.jpg
          curl -L --fail 'https://images.unsplash.com/photo-1697636979792-fb057f6cbe8d?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=60&w=3000' -o prepared-images/iphone-dark.jpg
          curl -L --fail 'https://images.unsplash.com/photo-1773414422103-7aa2623de1fa?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=60&w=3000' -o prepared-images/iphone-15-pro.jpg
          curl -L --fail 'https://images.pexels.com/photos/16247542/pexels-photo-16247542.jpeg?cs=srgb&dl=pexels-doouglasma-16247542.jpg&fm=jpg' -o prepared-images/apple-ecosystem.jpg
          curl -L --fail 'https://images.unsplash.com/photo-1680731096036-b5b606ea6172?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=60&w=3000' -o prepared-images/apple-watch.jpg
          curl -L --fail 'https://images.pexels.com/photos/10966534/pexels-photo-10966534.jpeg?cs=srgb&dl=pexels-matheus-oliveira-64077457-10966534.jpg&fm=jpg' -o prepared-images/airpods-macbook.jpg
          curl -L --fail 'https://images.unsplash.com/photo-1748667955709-d2f4ed0f06d4?auto=format&fit=crop&fm=jpg&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&ixlib=rb-4.1.0&q=60&w=3000' -o prepared-images/workspace-apple.jpg
          ls -lh prepared-images
      - name: Upload prepared images
        uses: actions/upload-artifact@v4
        with:
          name: sunset-site-images
          path: prepared-images/
          if-no-files-found: error
          retention-days: 1
