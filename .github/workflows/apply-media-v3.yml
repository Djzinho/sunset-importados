name: Apply corrected Sunset media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/apply-media-v3.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace broken WebP references with corrected JPGs
        run: |
          for f in site/index.html site/iphones/index.html site/dispositivos/index.html; do
            sed -i 's#iphone-dark-v2\.webp#iphone-dark-v3.jpg#g' "$f"
            sed -i 's#iphone-16-pro-v2\.webp#iphone-16-pro-v3.jpg#g' "$f"
            sed -i 's#apple-watch-v2\.webp#apple-watch-v3.jpg#g' "$f"
            sed -i 's#v=20260817-2#v=20260817-3#g' "$f"
          done
          grep -R 'media/.*-v3.jpg' site/index.html site/iphones/index.html site/dispositivos/index.html
      - name: Commit corrected references
        run: |
          git config user.name 'Sunset Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/index.html site/iphones/index.html site/dispositivos/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Use corrected high quality JPG product media'
          git push
