name: Repair product assets 2
on:
  push:
    paths:
      - '.github/workflows/repair-product-assets-2.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy original repository-safe assets to v2 paths
        run: |
          cp site/assets/media/iphone-17-pro-max-transparent-v1.webp site/assets/media/iphone-17-pro-max-user-v2.webp
          cp site/assets/media/ipad-transparent-v1.png site/assets/media/apple-ecosystem-user-v2.png
          file site/assets/media/iphone-17-pro-max-user-v2.webp site/assets/media/apple-ecosystem-user-v2.png
          git config user.name 'Sunset Repair Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/assets/media/iphone-17-pro-max-user-v2.webp site/assets/media/apple-ecosystem-user-v2.png
          git commit -m 'Restore working product image files'
          git push
