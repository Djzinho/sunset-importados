name: Repair product assets
on:
  push:
    paths:
      - '.github/workflows/repair-product-assets.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair image bytes from embedded payloads
        env:
          IPHONE_B64: 
          ECOSYSTEM_B64: 
        run: |
          python - <<'PY'
          import os,base64
          from pathlib import Path
          for env,name in [('IPHONE_B64','iphone-17-pro-max-user-v2.webp'),('ECOSYSTEM_B64','apple-ecosystem-user-v2.webp')]:
              data=base64.b64decode(os.environ[env])
              assert data[:4] == b'RIFF' and data[8:12] == b'WEBP', (name,data[:12])
              p=Path('site/assets/media')/name
              p.write_bytes(data)
              print(name,len(data),data[:12])
          PY
          git config user.name 'Sunset Asset Repair'
          git config user.email 'actions@users.noreply.github.com'
          git add site/assets/media/iphone-17-pro-max-user-v2.webp site/assets/media/apple-ecosystem-user-v2.webp
          git commit -m 'Repair transparent Home product assets'
          git push
