name: Fetch home product assets
on:
  push:
    paths:
      - '.github/workflows/fetch-home-product-assets.yml'
permissions:
  contents: write
jobs:
  fetch-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download assets
        run: |
          mkdir -p site/assets/media
          curl -L --fail --retry 3 'https://city-png.b-cdn.net/preview/preview_public/temp/orange-iphone-17-pro-max-in-front-and-back-view-131757670309qddqcltlwg.webp' -o site/assets/media/iphone-17-pro-max-transparent-v1.webp
          curl -L --fail --retry 3 'https://purepng.com/public/uploads/large/purepng.com-tablettechnologyelectronicstabletipad-1121525124090m1rbu.png' -o site/assets/media/ipad-transparent-v1.png
          file site/assets/media/iphone-17-pro-max-transparent-v1.webp site/assets/media/ipad-transparent-v1.png
      - name: Commit assets
        run: |
          git config user.name 'Sunset Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/assets/media/iphone-17-pro-max-transparent-v1.webp site/assets/media/ipad-transparent-v1.png
          git diff --cached --quiet && exit 0
          git commit -m 'Add transparent iPhone 17 Pro Max and iPad product assets'
          git push
