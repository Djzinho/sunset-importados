name: Fix Sunset site media

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/fix-site-media.yml'

permissions:
  contents: write

jobs:
  fix-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download high quality licensed photos
        run: |
          mkdir -p site/assets/media
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1697636979792-fb057f6cbe8d?auto=format&fit=crop&w=1800&q=86&fm=jpg' -o site/assets/media/iphone-dark-v3.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1727013884184-b313982327f3?auto=format&fit=crop&w=1800&q=86&fm=jpg' -o site/assets/media/iphone-16-pro-v3.jpg
          curl -L --fail --retry 3 'https://images.unsplash.com/photo-1680731096036-b5b606ea6172?auto=format&fit=crop&w=1600&q=86&fm=jpg' -o site/assets/media/apple-watch-v3.jpg
          file site/assets/media/*-v3.jpg
          test $(stat -c%s site/assets/media/iphone-dark-v3.jpg) -gt 50000
          test $(stat -c%s site/assets/media/iphone-16-pro-v3.jpg) -gt 50000
          test $(stat -c%s site/assets/media/apple-watch-v3.jpg) -gt 50000
      - name: Commit corrected media
        run: |
          git config user.name 'Sunset Media Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site/assets/media/*-v3.jpg
          git diff --cached --quiet && exit 0
          git commit -m 'Fix product media with high quality JPG assets'
          git push
