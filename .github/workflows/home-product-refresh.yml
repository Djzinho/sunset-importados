name: Refresh home product choices
on:
  push:
    paths:
      - '.github/workflows/home-product-refresh.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download validated transparent product assets
        run: |
          python -m pip install --quiet pillow
          mkdir -p site/assets/media
          curl -L --fail --retry 3 'https://city-png.b-cdn.net/preview/preview_public/temp/orange-iphone-17-pro-max-in-front-and-back-view-131757670309qddqcltlwg.webp' -o site/assets/media/iphone-17-pro-max-transparent-v1.webp
          curl -L --fail --retry 3 'https://purepng.com/public/uploads/large/purepng.com-tablettechnologyelectronicstabletipad-1121525124090m1rbu.png' -o site/assets/media/ipad-transparent-v1.png
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for name in ['iphone-17-pro-max-transparent-v1.webp','ipad-transparent-v1.png']:
              p=Path('site/assets/media')/name
              im=Image.open(p).convert('RGBA')
              alpha=im.getchannel('A').getextrema()
              print(name, im.size, alpha)
              if min(im.size) < 700:
                  raise SystemExit(f'{name} resolution too low: {im.size}')
              if alpha[0] == 255:
                  raise SystemExit(f'{name} has no transparent pixels')
          PY
      - name: Rebuild Home product section
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('site/index.html')
          s=p.read_text()

          # Hero: remove product image below the title/CTAs entirely.
          s=re.sub(r'<div class="hero-art hero-photo reveal">.*?</div></div></section>', '</div></div></section>', s, count=1, flags=re.S)

          # Rebuild Apple highlight as two clean product choices.
          new_section='''<section class="section product-choice-section"><div class="container"><div class="section-head reveal"><div class="eyebrow">APPLE EM DESTAQUE</div><h2>Escolha o próximo passo.</h2><p class="lede">Duas rotas rápidas para chegar ao que você procura.</p></div><div class="product-choice-grid"><article class="product-choice-card reveal"><div class="product-choice-visual"><img src="/assets/media/iphone-17-pro-max-transparent-v1.webp" alt="Mockup transparente do iPhone 17 Pro Max" loading="eager" decoding="async"></div><div class="product-choice-copy"><div class="eyebrow">IPHONE 17 PRO MAX</div><h3>Encontre seu iPhone.</h3><p>Consulte modelos novos, seminovos e possibilidades de upgrade.</p><a class="btn btn-secondary" href="/iphones/">Ver iPhones</a></div></article><article class="product-choice-card reveal"><div class="product-choice-visual"><img src="/assets/media/ipad-transparent-v1.png" alt="Mockup transparente de iPad" loading="lazy" decoding="async"></div><div class="product-choice-copy"><div class="eyebrow">IPAD</div><h3>Veja mais dispositivos.</h3><p>Explore iPad e outras categorias do ecossistema Apple.</p><a class="btn btn-secondary" href="/dispositivos/">Ver dispositivos</a></div></article></div></div></section>'''
          pat=r'<section class="section"><div class="container"><div class="section-head reveal"><div class="eyebrow">APPLE EM DESTAQUE</div>.*?</section>'
          s,n=re.subn(pat,new_section,s,count=1,flags=re.S)
          if n!=1:
              raise SystemExit('Apple highlight section not found exactly once')

          # Remove the entire scrolling editorial rail / Tecnologia em foco section.
          pat2=r'<section class="section compact"><div class="container reveal"><div class="eyebrow">TECNOLOGIA EM FOCO</div>.*?</section>'
          s,n2=re.subn(pat2,'',s,count=1,flags=re.S)
          if n2!=1:
              raise SystemExit('Tecnologia em foco section not found exactly once')

          p.write_text(s)

          css=Path('site/assets/styles-cinematic.css')
          c=css.read_text()
          block='''

/* Home 2026-08-17: no hero product, two deliberate product choices, no editorial rail */
.hero .hero-grid{grid-template-columns:1fr!important;max-width:920px!important;margin-inline:auto!important;justify-items:center!important}
.hero .hero-copy{max-width:820px!important;margin-inline:auto!important}
.product-choice-section{padding-top:88px!important;padding-bottom:88px!important}
.product-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:42px;width:100%}
.product-choice-card{min-width:0;border:1px solid #222;background:#080808;padding:26px 22px 24px;display:flex;flex-direction:column;align-items:center;text-align:center;overflow:hidden}
.product-choice-visual{width:100%;height:360px;display:grid;place-items:center;overflow:visible}
.product-choice-visual img{display:block;width:100%;height:100%;max-width:470px;object-fit:contain;object-position:center;filter:drop-shadow(0 28px 36px rgba(0,0,0,.62))}
.product-choice-copy{width:100%;max-width:440px;margin:8px auto 0;text-align:center}
.product-choice-copy .eyebrow{margin-bottom:8px}
.product-choice-copy h3{font-size:clamp(1.8rem,3vw,2.7rem);line-height:.96}
.product-choice-copy p{color:var(--muted);max-width:390px;margin:10px auto 16px}
.product-choice-copy .btn{min-width:160px}
@media(max-width:767px){
  .hero{min-height:auto!important;padding-top:82px!important;padding-bottom:28px!important}
  .product-choice-section{padding:34px 0 38px!important}
  .product-choice-section .section-head .lede{max-width:300px!important}
  .product-choice-grid{grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:8px!important;margin-top:20px!important;padding:0!important;overflow:visible!important}
  .product-choice-card{padding:12px 7px 12px!important;border-color:#252525!important;background:#070707!important}
  .product-choice-visual{height:142px!important}
  .product-choice-visual img{max-width:150px!important;filter:drop-shadow(0 16px 22px rgba(0,0,0,.58))!important}
  .product-choice-copy{margin-top:5px!important}
  .product-choice-copy .eyebrow{font-size:.49rem!important;letter-spacing:.12em!important;margin-bottom:5px!important}
  .product-choice-copy h3{font-size:1.18rem!important;line-height:.95!important;max-width:145px!important;margin-inline:auto!important}
  .product-choice-copy p{font-size:.67rem!important;line-height:1.35!important;margin:7px auto 10px!important;max-width:150px!important}
  .product-choice-copy .btn{width:100%!important;min-width:0!important;min-height:42px!important;padding:0 5px!important;font-size:.73rem!important}
}
'''
          if '/* Home 2026-08-17: no hero product' not in c:
              css.write_text(c+block)

          media=Path('MEDIA_SOURCES.md')
          m=media.read_text() if media.exists() else '# Media sources\n'
          add='''\n\n## Home product choice refresh\n- `site/assets/media/iphone-17-pro-max-transparent-v1.webp` — transparent preview/render of iPhone 17 Pro Max sourced from CityPNG page `Orange iPhone 17 Pro Max in Front and Back View`; CityPNG states commercial use is allowed with attribution. Source page: https://www.citypng.com/photo/0c867363/orange-iphone-17-pro-max-in-front-and-back-view\n- `site/assets/media/ipad-transparent-v1.png` — transparent tablet/iPad-tagged PNG from PurePNG, 2818×2818 source page; PurePNG states commercial use is allowed with no attribution. Source page: https://purepng.com/photo/7467/electronics-tablet\n- Product assets are illustrative mockups and do not represent current Sunset inventory.\n'''
          if '## Home product choice refresh' not in m:
              media.write_text(m+add)
          PY
      - name: Commit Home refresh
        run: |
          git config user.name 'Sunset Product Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add site MEDIA_SOURCES.md
          git diff --cached --quiet && exit 0
          git commit -m 'Simplify Home with iPhone 17 Pro Max and iPad choices'
          git push
