name: Prepare transparent product mockups
on:
  push:
    paths:
      - '.github/workflows/prepare-transparent-mockups.yml'
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect source download pages
        run: |
          mkdir -p /tmp/mockups
          for item in iphone:24306 macbook:10236 watch:56576; do
            name=${item%%:*}; id=${item##*:}
            curl -L --retry 3 -A 'Mozilla/5.0' "https://mockups-design.com/download/$id/" -o "/tmp/mockups/$name.html"
            echo "=== $name ==="
            file "/tmp/mockups/$name.html"
            grep -Eio 'https?[^"'"'"'<> ]+\.(zip|rar|7z|psd)(\?[^"'"'"'<> ]*)?' "/tmp/mockups/$name.html" | head -20 || true
            grep -Eio 'href=["'"'][^"'"']+["'"']' "/tmp/mockups/$name.html" | grep -Ei 'download|zip|psd|wp-content' | head -40 || true
          done
