name: Verify current product assets
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          file site/assets/media/iphone-17-pro-max-user-v1.webp
          file site/assets/media/apple-ecosystem-user-v1.webp
          python - <<'PY'
          from PIL import Image
          for p in ['site/assets/media/iphone-17-pro-max-user-v1.webp','site/assets/media/apple-ecosystem-user-v1.webp']:
              try:
                  im=Image.open(p)
                  print(p, im.format, im.size)
              except Exception as e:
                  print(p, 'INVALID', repr(e))
                  raise
          PY
